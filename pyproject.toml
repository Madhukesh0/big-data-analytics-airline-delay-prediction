[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skypredict"
version = "1.0.0"
description = "SkyPredict: Big Data Analytics for Airline Delay Prediction (BCS714 D, 2026-2027)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyspark>=3.5,<4.0",
    "scikit-learn>=1.3",
    "streamlit>=1.32",
    "joblib>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that require a working Java + PySpark environment",
]
